server:
  port: 8081
spring:
  application:
    name: catalog-api
  datasource:
    url: jdbc:sqlserver://localhost:5433;trustServerCertificate=true;databaseName=Microsoft.eShopOnContainers.Services.CatalogDb
    username: sa
    password: Pass@word
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: validate
      naming:
        implicit-strategy: org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
        physical-strategy: org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
